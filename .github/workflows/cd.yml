name: CD

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Azure login
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Login to ACR
              run: az acr login --name bookcatalogacr2026

            - name: Build Docker image
              run: docker build -f WebApi/Dockerfile -t bookcatalogacr2026-hmakfwc5gdcvawd.azurecr.io/bookcatalog-api:${{ github.sha }} .

            - name: Push Docker image
              run: docker push bookcatalogacr2026-hmakfwc5gdcvawd.azurecr.io/bookcatalog-api:${{ github.sha }}
