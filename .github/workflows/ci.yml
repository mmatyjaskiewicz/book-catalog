name: CI

on:
    push:
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore BookCatalog.sln

            - name: Build
              run: dotnet build WebApi/WebApi.csproj --no-restore --configuration Release
